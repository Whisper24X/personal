# Nginx 配置文件 - Mind2Build
# 使用说明：
# 1. 将此文件复制到 nginx 配置目录，例如：/etc/nginx/sites-available/mind2build
# 2. 创建软链接：sudo ln -s /etc/nginx/sites-available/mind2build /etc/nginx/sites-enabled/
# 3. 测试配置：sudo nginx -t
# 4. 重载配置：sudo nginx -s reload
# 
# 或者直接在 nginx.conf 的 http 块中 include 此文件：
# include /path/to/project/config/nginx.conf;

# 上游服务器配置
upstream backend {
    server localhost:3000;
    keepalive 32;
}

upstream frontend {
    server localhost:5173;
    keepalive 32;
}

# 限制请求体大小（用于文件上传等）
client_max_body_size 50M;

# 日志格式
log_format mind2build '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';

# 主服务器配置
server {
    listen 80;
    server_name localhost;  # 生产环境请修改为实际域名
    
    # 日志配置
    access_log /var/log/nginx/mind2build-access.log mind2build;
    error_log /var/log/nginx/mind2build-error.log warn;
    
    # 字符集
    charset utf-8;
    
    # 根目录（如果使用静态文件部署前端）
    # root /path/to/frontend/dist;
    # index index.html;
    
    # ==================== WebSocket 配置 ====================
    # 交互式会话 WebSocket 连接
    location /api/interactive/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # WebSocket 必需的头信息
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超时设置（重要：交互式会话可能需要长时间连接）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # 禁用缓冲（WebSocket 必需）
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ==================== 后端 API 配置 ====================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # 基本代理头信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（API 请求可能需要较长时间，特别是生成 PRD 等操作）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # CORS 头信息（如果需要，也可以在后端处理）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # ==================== 前端配置 ====================
    # 方案1：代理到前端开发/预览服务器（推荐用于开发环境）
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 前端资源缓存
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
    }
    
    # 方案2：直接提供静态文件（推荐用于生产环境）
    # 取消注释以下配置，并注释掉上面的 location / 配置
    # location / {
    #     root /path/to/frontend/dist;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    #     
    #     # 静态资源缓存
    #     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }
    
    # ==================== 健康检查 ====================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ==================== 安全配置 ====================
    # 隐藏 nginx 版本信息
    server_tokens off;
    
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 内容类型嗅探保护
    add_header X-Content-Type-Options "nosniff" always;
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

