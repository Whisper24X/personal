# ============================================================
# AINative Sandbox 模式 — Supervisord 进程管理配置
# ============================================================
#
# 管理以下进程（按优先级启动）：
#
#   1. nginx    (priority=30)  — 反向代理，统一入口 :8080
#   2. backend  (priority=100) — Go/Kratos 后端，air 热重载
#   3. shadow   (priority=110) — Shadow 前端（Rsbuild），pnpm dev
#   4. app      (priority=120) — Taro H5 App，npm run dev:h5:local
#
# 日志输出到 /workspace/logs/ 目录下，每个服务独立日志文件
# ============================================================

# ── Supervisord 主进程配置 ──
[supervisord]
# 前台运行（容器内必须 nodaemon=true，否则容器会立即退出）
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
pidfile=/run/supervisord.pid
user=root

# ── Unix Socket（supervisorctl 通过此 socket 与 supervisord 通信） ──
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── supervisorctl 客户端配置 ──
[supervisorctl]
serverurl=unix:///run/supervisor.sock

# ============================================================
# 进程定义
# ============================================================

# ── Nginx 反向代理 ──
# 前台模式运行（daemon off），由 supervisord 管理生命周期
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/workspace/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

# ── Go 后端（Kratos + air 热重载） ──
# GOFLAGS='-p=1' 限制并行编译数，降低沙箱内的内存峰值
[program:backend]
command=/bin/bash -c "GOFLAGS='-p=1' air -c .air.toml"
directory=/workspace/ainative-backend
environment=GO_ENV="local"
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=100
redirect_stderr=true
stdout_logfile=/workspace/logs/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

# ── Shadow 前端（Rsbuild dev server） ──
# 启动前先执行 pnpm install 安装依赖
# APP_PROJECT_NAME=shadow  — 项目标识
# BASE_API_URL=/api/yanxue — API 前缀，经由 nginx 转发到 Go 后端
# VITE_BASE_URL=/shadow/   — 静态资源 base path（nginx location 前缀一致）
# SANDBOX=true             — 标记沙箱环境，部分行为会调整
[program:shadow]
command=/bin/bash -c "export APP_PROJECT_NAME=shadow BASE_API_URL=/api/yanxue CI=true BROWSER=none SANDBOX=true && cd /workspace/ainative-shadow && pnpm install && pnpm dev"
directory=/workspace/ainative-shadow
environment=CI="true",BROWSER="none",APP_PROJECT_NAME="shadow",BASE_API_URL="/api/yanxue",VITE_BASE_URL="/shadow/",VITE_API_URL="/api",SANDBOX="true"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=110
redirect_stderr=true
stdout_logfile=/workspace/logs/shadow.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

# ── Taro H5 App（小程序 H5 版本） ──
# 启动前先执行 npm install 安装依赖
# TARO_APP_API="/api"  — API 请求前缀
# CI=true, BROWSER=none — 禁止自动打开浏览器
[program:app]
command=/bin/bash -c "npm install && npm run dev:h5:local"
directory=/workspace/ainative-app
environment=TARO_APP_API="/api",BROWSER="none",CI="true"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=120
redirect_stderr=true
stdout_logfile=/workspace/logs/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

# ============================================================
# 进程分组（方便 supervisorctl 批量操作）
# ============================================================

# 基础设施组（nginx）— 最先启动
[group:infrastructure]
programs=nginx
priority=10

# 服务组（backend + shadow + app）— 在 nginx 之后启动
[group:services]
programs=backend,shadow,app
priority=100
