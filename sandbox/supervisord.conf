[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ============================================================
; PostgreSQL
; ============================================================

[program:postgresql]
command=/usr/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; Redis
; ============================================================

[program:redis]
command=/usr/bin/redis-server /etc/redis.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; Nginx
; ============================================================

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; 应用服务
; ============================================================

[program:backend]
command=/bin/bash -c "cd /workspace/ainative-backend && air -c .air.toml"
directory=/workspace/ainative-backend
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:shadow]
command=/bin/bash -c "cd /workspace/ainative-shadow && pnpm install && pnpm dev"
directory=/workspace/ainative-shadow
environment=VITE_BASE_URL="/shadow/",VITE_API_URL="/api"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; 服务组
; ============================================================

[group:infrastructure]
programs=postgresql,redis,nginx
priority=10

[group:services]
programs=backend,shadow
priority=100
