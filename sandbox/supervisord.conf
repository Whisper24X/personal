; ============================================================
; Supervisor 配置 — 管理沙箱内所有进程
; ============================================================
;
; 启动顺序（按 priority 升序）:
;   1. nginx    (30)  — 反向代理，统一入口 :8080
;   2. backend (100)  — Go/Kratos 后端，air 热重载，:8000
;   3. shadow  (110)  — Vue3 管理后台（Vite），:8100
;   4. app     (120)  — Taro H5 移动端，:8200
;
; 日志全部输出到 stdout/stderr，通过 docker logs 查看
; 管理命令: supervisorctl status / restart <name>
; ============================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ============================================================
; Nginx — 反向代理统一入口 :8080
; ============================================================

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; backend — Go/Kratos 后端 :8000
; ============================================================
; air 监听文件变更自动编译重启，配置见 ainative-backend/.air.toml

[program:backend]
command=air -c .air.toml
directory=/workspace/ainative-backend
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; shadow — Vue3 管理后台 :8100
; ============================================================
; 首次启动自动 pnpm install，Vite 以 /shadow/ 为 base path

[program:shadow]
command=/bin/bash -c "pnpm install && pnpm dev"
directory=/workspace/ainative-shadow
environment=CI="true",BROWSER="none",APP_PROJECT_NAME="shadow",BASE_API_URL="/api/yanxue",VITE_BASE_URL="/shadow/",VITE_API_URL="/api",SANDBOX="true"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; app — Taro H5 移动端 :8200
; ============================================================
; 首次启动自动 pnpm install，API 请求走 /api 由 Nginx 反代到后端

[program:app]
command=/bin/bash -c "pnpm install && pnpm dev:h5"
directory=/workspace/ainative-app
environment=TARO_APP_API="/api"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; 服务分组（用于 supervisorctl 批量操作）
; ============================================================
; supervisorctl restart services:*   — 重启所有应用
; supervisorctl restart infrastructure:*  — 重启 Nginx

[group:infrastructure]
programs=nginx
priority=10

[group:services]
programs=backend,shadow,app
priority=100
