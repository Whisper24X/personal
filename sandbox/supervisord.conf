; ============================================================
; Supervisor 配置 — 管理沙箱内所有进程
; ============================================================
;
; 启动顺序（按 priority 升序）:
;   1. nginx    (30)  — 反向代理，统一入口 :8080
;   2. backend (100)  — Go/Kratos 后端，air 热重载，:8000
;   3. shadow  (110)  — Vue3 管理后台（Vite），:8100
;   4. app     (120)  — Taro H5 移动端，:8200
;
; 日志按服务分文件存储在 /workspace/logs/
; 查看方式:
;   sandbox.sh logs backend              — 实时跟踪
;   cat /workspace/logs/backend.log  — 查看全部
; ============================================================

[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ============================================================
; Nginx — 反向代理统一入口 :8080
; ============================================================

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/workspace/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ============================================================
; backend — Go/Kratos 后端 :8000
; ============================================================
; air 监听文件变更自动编译重启，配置见 ainative-backend/.air.toml
; GO_ENV=development 使用 development.yaml 启动后端

[program:backend]
command=/bin/bash -c "GOFLAGS='-p=1' air -c .air.toml"
directory=/workspace/ainative-backend
environment=GO_ENV="development"
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=100
redirect_stderr=true
stdout_logfile=/workspace/logs/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

; ============================================================
; shadow — Vue3 管理后台 :8100
; ============================================================
; 首次启动自动 pnpm install，Vite 以 /shadow/ 为 base path

[program:shadow]
command=/bin/bash -c "export APP_PROJECT_NAME=shadow BASE_API_URL=/api/yanxue CI=true BROWSER=none SANDBOX=true && cd /workspace/ainative-shadow && pnpm install && pnpm dev"
directory=/workspace/ainative-shadow
environment=CI="true",BROWSER="none",APP_PROJECT_NAME="shadow",BASE_API_URL="/api/yanxue",VITE_BASE_URL="/shadow/",VITE_API_URL="/api",SANDBOX="true"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=110
redirect_stderr=true
stdout_logfile=/workspace/logs/shadow.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ============================================================
; app — Taro H5 移动端 :8200
; ============================================================
; 使用 dev:h5:local 使 H5 连接沙箱内 backend（localhost:8080/api），而非测试网

[program:app]
command=/bin/bash -c "npm install && npm run dev:h5:local"
directory=/workspace/ainative-app
environment=TARO_APP_API="/api",BROWSER="none",CI="true"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=120
redirect_stderr=true
stdout_logfile=/workspace/logs/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

; ============================================================
; 服务分组（用于 supervisorctl 批量操作）
; ============================================================
; supervisorctl restart services:*   — 重启所有应用
; supervisorctl restart infrastructure:*  — 重启 Nginx

[group:infrastructure]
programs=nginx
priority=10

[group:services]
programs=backend,shadow,app
priority=100
