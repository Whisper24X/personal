# Nginx 反向代理配置 - 统一入口
# 所有服务通过单一端口 8080 访问

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 请求体大小限制（文件上传）
    client_max_body_size 100M;

    # 代理超时配置
    proxy_connect_timeout 60;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name localhost;
        charset utf-8;

        # 后端 API（去掉 /api/ 前缀）
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理后台（Shadow）
        location /shadow/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 移动端 H5（App）
        location /app/ {
            proxy_pass http://127.0.0.1:8200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PC 端（保留 /pc/ 前缀）
        location /pc/ {
            proxy_pass http://127.0.0.1:8300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查端点
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # 默认首页 - 显示服务列表
        location / {
            default_type "text/html; charset=utf-8";
            return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AINative Workspace</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{background:rgba(255,255,255,0.95);border-radius:20px;padding:60px 40px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:600px;width:100%}h1{font-size:32px;font-weight:700;color:#333;text-align:center;margin-bottom:10px}p{text-align:center;color:#666;margin-bottom:40px;font-size:14px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}a{display:flex;align-items:center;justify-content:center;padding:20px;background:#fff;border:2px solid #e0e0e0;border-radius:12px;text-decoration:none;color:#333;font-weight:600;font-size:16px;transition:all 0.3s;position:relative;overflow:hidden}a:before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent);transition:left 0.5s}a:hover{border-color:#667eea;color:#667eea;transform:translateY(-2px);box-shadow:0 8px 16px rgba(102,126,234,0.2)}a:hover:before{left:100%}@media(max-width:480px){.links{grid-template-columns:1fr}}</style></head><body><div class="container"><h1>AINative Workspace</h1><p>开发环境服务导航</p><div class="links"><a href="/app/" target="_blank">App</a><a href="/pc/" target="_blank">PC</a><a href="/shadow/" target="_blank">Shadow</a><a href="/api/" target="_blank">Backend</a></div></div></body></html>';
        }
    }
}
