<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序预览二维码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .qrcode-section {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .qrcode-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .qrcode-image {
            width: 280px;
            height: 280px;
            border: 1px solid #ddd;
            border-radius: 8px;
            object-fit: contain;
            background: #f9f9f9;
        }
        
        .qrcode-placeholder {
            width: 280px;
            height: 280px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            color: #999;
        }
        
        .qrcode-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .qrcode-info {
            font-size: 14px;
            color: #666;
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .instructions ol li {
            margin-bottom: 8px;
        }
        
        .code-block {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            margin: 10px 0;
            overflow-x: auto;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .refresh-time {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .qrcode-image,
            .qrcode-placeholder {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 小程序预览</h1>
        <p class="subtitle">扫描二维码体验小程序</p>
        
        <div class="qrcode-section">
            <div class="qrcode-wrapper" id="qrcode-wrapper">
                <!-- 二维码将动态加载到这里 -->
            </div>
        </div>
        
        <div class="instructions">
            <h3>📖 使用说明</h3>
            <ol>
                <li>在项目根目录执行以下命令生成预览二维码：
                    <div class="code-block">make app-preview</div>
                </li>
                <li>命令执行后会自动生成二维码并保存到 <code>ainative-app/qrcode/</code> 目录</li>
                <li>二维码将自动显示在本页面，使用微信扫描即可预览</li>
                <li>预览二维码有效期为 30 分钟</li>
                <li>如需上传体验版到微信后台，执行：
                    <div class="code-block">make app-upload-test</div>
                </li>
            </ol>
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="window.location.reload()">🔄 刷新页面</button>
            <a class="btn" href="/" target="_blank">🏠 返回首页</a>
        </div>
    </div>
    
    <script>
        // 检查二维码图片
        async function checkQRCode() {
            const wrapper = document.getElementById('qrcode-wrapper');
            
            try {
                // 尝试获取二维码目录的文件列表
                const response = await fetch('/qrcode/');
                const text = await response.text();
                
                // 简单解析目录列表，查找图片文件
                const imageMatch = text.match(/href="([^"]*\.(png|jpg|jpeg))"/i);
                
                if (imageMatch) {
                    const imagePath = '/qrcode/' + imageMatch[1];
                    wrapper.innerHTML = `
                        <span class="status-badge status-success">✓ 二维码已生成</span>
                        <img src="${imagePath}" alt="小程序预览二维码" class="qrcode-image" 
                             onerror="showPlaceholder()">
                        <div class="qrcode-info">
                            使用微信扫描二维码预览小程序<br>
                            有效期：30 分钟
                        </div>
                        <div class="refresh-time">
                            最后检查时间：${new Date().toLocaleString('zh-CN')}
                        </div>
                    `;
                } else {
                    showPlaceholder();
                }
            } catch (error) {
                showPlaceholder();
            }
        }
        
        function showPlaceholder() {
            const wrapper = document.getElementById('qrcode-wrapper');
            wrapper.innerHTML = `
                <span class="status-badge status-waiting">⏳ 等待生成二维码</span>
                <div class="qrcode-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <div>暂无二维码</div>
                </div>
                <div class="qrcode-info">
                    请先执行 <code>make app-preview</code> 生成预览二维码
                </div>
                <div class="refresh-time">
                    最后检查时间：${new Date().toLocaleString('zh-CN')}
                </div>
            `;
        }
        
        // 页面加载时检查
        checkQRCode();
        
        // 每 30 秒自动检查一次
        setInterval(checkQRCode, 30000);
    </script>
</body>
</html>
