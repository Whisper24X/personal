# ============================================================
# AINative Sandbox 模式 — Nginx 反向代理配置
# ============================================================
#
# 统一监听 8080 端口，按路径将请求分发到不同的后端服务：
#
#   /api/          → ainative-backend (Go/Kratos, :8000)
#   /shadow/       → ainative-shadow  (Rsbuild dev server, :5176)
#   /app/          → ainative-app     (Taro H5 dev server, :8200)
#   /health        → 健康检查（直接返回 200）
#   /              → ainative-app 首页（默认兜底）
#
# WebSocket 支持:
#   /ws            — 不存在独立 ws location，走 /api/ 代理
#   /rsbuild-hmr   — Rsbuild HMR 热更新 WebSocket
#
# 注意: 此配置仅在 Sandbox 模式下使用（entrypoint.sh 自动检测）
# ============================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # 允许上传大文件（如图片、视频素材）
    client_max_body_size 100M;

    # 代理超时设置（后端可能有长耗时操作）
    proxy_connect_timeout 60;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # 启用 gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # WebSocket 升级映射：有 Upgrade 头时保持连接升级，否则关闭
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name localhost;
        charset utf-8;

        # ── 后端 API 静态资源（.ts/.js/.vue 等源码文件）──
        # 优先级高于 /api/，开发模式下源码映射请求走 app dev server
        location ~ ^/api/.*\.(ts|js|mjs|vue|less|css|scss|map)$ {
            proxy_pass http://127.0.0.1:8200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── 后端 API（Go/Kratos 服务，去掉 /api 前缀转发） ──
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Shadow 前端（Rsbuild dev server） ──
        location /shadow/ {
            proxy_pass http://0.0.0.0:5176/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Shadow 静态资源 ──
        location /static/ {
            proxy_pass http://0.0.0.0:5176;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Rsbuild HMR WebSocket（热模块替换） ──
        location /rsbuild-hmr {
            proxy_pass http://0.0.0.0:5176/rsbuild-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── App 前端（Taro H5 dev server，/app → /app/ 301 规范化） ──
        location = /app {
            return 302 /app/;
        }

        location /app/ {
            proxy_pass http://127.0.0.1:8200/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 健康检查 ──
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ── 根路径欢迎页 ──
        location = / {
            default_type "text/html; charset=utf-8";
            return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AINative Workspace</title></head><body><h1>AINative Workspace</h1></body></html>';
        }

        # ── 兜底：其他所有路径转发到 App dev server ──
        location / {
            proxy_pass http://127.0.0.1:8200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
