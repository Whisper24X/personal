syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//研学抢票站点配置表
service GrabTicketSiteConfig {
  //研学抢票站点配置表-创建一条数据
  rpc CreateGrabTicketSiteConfig(CreateGrabTicketSiteConfigReq) returns (CreateGrabTicketSiteConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_site_config/create"
      body: "*"
    };
  }
  //研学抢票站点配置表-更新一条数据
  rpc UpdateGrabTicketSiteConfig(UpdateGrabTicketSiteConfigReq) returns (UpdateGrabTicketSiteConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_site_config/update"
      body: "*"
    };
  }
  //研学抢票站点配置表-删除单条数据
  rpc DeleteGrabTicketSiteConfig(DeleteGrabTicketSiteConfigReq) returns (DeleteGrabTicketSiteConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_site_config/delete"
      body: "*"
    };
  }
  //研学抢票站点配置表-单条数据查询
  rpc GetGrabTicketSiteConfigInfo(GetGrabTicketSiteConfigInfoReq) returns (GetGrabTicketSiteConfigInfoReply) {
    option (google.api.http) = {get: "/yanxue/api/shadow/v1/grab_ticket_site_config/info"};
  }
  //研学抢票站点配置表-列表数据查询
  rpc GetGrabTicketSiteConfigList(GetGrabTicketSiteConfigListReq) returns (GetGrabTicketSiteConfigListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_site_config/list"
      body: "*"
    };
  }
  //研学抢票站点配置表-更新状态
  rpc UpdateGrabTicketSiteConfigStatus(UpdateGrabTicketSiteConfigStatusReq) returns (UpdateGrabTicketSiteConfigStatusReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_site_config/update_status"
      body: "*"
    };
  }
}

//请求-研学抢票站点配置表-更新状态
message UpdateGrabTicketSiteConfigStatusReq {
  string id = 1; // id
  string status = 2; // 状态
}

//响应-研学抢票站点配置表-更新状态
message UpdateGrabTicketSiteConfigStatusReply {}

//研学抢票站点配置表信息
message GrabTicketSiteConfigInfo {
  string id = 1; // id
  string siteName = 2; // 站点名称
  string siteDomain = 3; // 站点域名
  string targetURL = 4; // 目标URL
  string status = 5; // 状态
  string createdAt = 6; // 创建时间
  string updatedAt = 7; // 更新时间
  int32 taskUserLimit = 8; // 任务用户人数限制
}

//请求-研学抢票站点配置表-创建一条数据
message CreateGrabTicketSiteConfigReq {
  string siteName = 1; // 站点名称
  string siteDomain = 2; // 站点域名
  string targetURL = 3; // 目标URL
  string status = 4; // 状态
  int32 taskUserLimit = 5; // 任务用户人数限制
}

//响应-研学抢票站点配置表-创建一条数据
message CreateGrabTicketSiteConfigReply {
  string id = 1; // id
}

//请求-研学抢票站点配置表-更新一条数据
message UpdateGrabTicketSiteConfigReq {
  string id = 1; // id
  string siteDomain = 2; // 站点域名
  string targetURL = 3; // 目标URL
  string status = 4; // 状态
  int32 taskUserLimit = 5; // 任务用户人数限制
}

//响应-研学抢票站点配置表-更新一条数据
message UpdateGrabTicketSiteConfigReply {}

//请求-研学抢票站点配置表-删除单条数据
message DeleteGrabTicketSiteConfigReq {
  string id = 1; // id
}

//响应-研学抢票站点配置表-删除单条数据
message DeleteGrabTicketSiteConfigReply {}

//请求-研学抢票站点配置表-单条数据查询
message GetGrabTicketSiteConfigInfoReq {
  string id = 1; // id
}

//响应-研学抢票站点配置表-单条数据查询
message GetGrabTicketSiteConfigInfoReply {
  GrabTicketSiteConfigInfo info = 1;
}

//请求-研学抢票站点配置表-列表数据查询
message GetGrabTicketSiteConfigListReq {
  int32 page = 1; //页码
  int32 pageSize = 2; //页数
}

//响应-研学抢票站点配置表-列表数据查询
message GetGrabTicketSiteConfigListReply {
  int32 total = 1; //总数
  repeated GrabTicketSiteConfigInfo list = 2; // 列表数据
}
