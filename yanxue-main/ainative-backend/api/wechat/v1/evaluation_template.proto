syntax = "proto3";

package wechat.v1;

import "google/api/annotations.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/wechat/v1;v1";

//评价模版
service EvaluationTemplate {
  //评价模版-查询评价模版详情
  rpc GetEvaluationTemplateInfo(GetEvaluationTemplateInfoReq) returns (GetEvaluationTemplateInfoReply) {
    option (google.api.http) = {get: "/yanxue/wechat/v1/evaluation_template/info"};
  }
}

//评价模版信息
message EvaluationTemplateInfo {
  string id = 1; // id
  string templateName = 2; // 模版名称
  string evaluationObject = 3; // 评价对象
  string business = 4; // 所属业务
  repeated string evaluationDimension = 5; // 评价维度
  repeated string evaluationLabel = 6; // 评价标签
  string tips = 7; // 温馨提示
}

//请求-评价模版-单条数据查询
message GetEvaluationTemplateInfoReq {
  string templateName = 1; // 模版名称
}

//响应-评价模版-单条数据查询
message GetEvaluationTemplateInfoReply {
  EvaluationTemplateInfo info = 1;
}
