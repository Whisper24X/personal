# k8s 管理UI
# https://rancher.yc345.tv/

# 定义项目构建或部署过程中使用的环境变量
variables:
  DOCKER_REGISTRY: docker.yc345.tv
  K8S_DEPLOYMENT: yanxue
  NAMESPACE: 7to12
  HOME: /builds

stages:
  - build_test
  - deploy_test
  - deploy_test_rollback
  - build_stage
  - deploy_stage
  - deploy_stage_rollback
  - build_pro

.tag_testenv_k8s: &testenv_k8s_tag
  tags:
    - testenv
    - kubernetes

.before_script: &before_script
  before_script:
    - export GO111MODULE=on
    - export GOPROXY=https://goproxy.cn,direct
    - export GOPRIVATE=gitlab.yc345.tv
    - |
      cat <<-EOF >> ~/.gitconfig
      [url "git@github.com:"]
          insteadOf = https://github.com/
      [url "git@gitlab.yc345.tv:"]
          insteadOf = https://gitlab.yc345.tv/
      EOF
    - mkdir ~/.ssh && chmod 700 ~/.ssh && cat $PRIVATE_KEY > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - |
      cat <<-EOF >> ~/.ssh/config
      Host *
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
      EOF
    - chmod 600 ~/.ssh/config

