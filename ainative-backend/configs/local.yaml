# 沙箱/本地环境配置
# GO_ENV=local 时加载，跳过 Nacos 服务注册（main.go 不添加 Registrar）
# 复用 development 的 PG/Redis 等配置（与 sandbox/.env 一致）
env: local

yc:
  redis:
    yanxue:
      name: yanxue
      addr: 10.8.8.117:6379
      username:
      password:
      db: 7
      readTimeout: 3
      writeTimeout:
      keyPrefix:
      maxLatency:
      poolFIFO: true
      poolSize: 10
      poolTimeout: 5
      minIdleConns: 0
  pg:
    yanxue:
      name: yanxue
      host: 10.8.8.110
      port: 5433
      user: postgres
      password: 7to12pg12
      db: yanxue
      sslMode: disable
      maxIdleConns: 5
      maxOpenConns: 10
      connMaxLifetime: 60s
      debug: true
      singularTable: true
      disableMetric: false
      slowThreshold: 0.5s
  nacos:
    host: 127.0.0.1
    port: 8848
    username: nacos
    password: nacos
  cronTasks:
