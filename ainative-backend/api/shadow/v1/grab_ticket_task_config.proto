syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//研学抢票任务配置表
service GrabTicketTaskConfig {
  //研学抢票任务配置表-创建一条数据
  rpc CreateGrabTicketTaskConfig(CreateGrabTicketTaskConfigReq) returns (CreateGrabTicketTaskConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_task_config/create"
      body: "*"
    };
  }
  //研学抢票任务配置表-更新一条数据
  rpc UpdateGrabTicketTaskConfig(UpdateGrabTicketTaskConfigReq) returns (UpdateGrabTicketTaskConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_task_config/update"
      body: "*"
    };
  }
  //研学抢票任务配置表-删除单条数据
  rpc DeleteGrabTicketTaskConfig(DeleteGrabTicketTaskConfigReq) returns (DeleteGrabTicketTaskConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_task_config/delete"
      body: "*"
    };
  }
  //研学抢票任务配置表-单条数据查询
  rpc GetGrabTicketTaskConfigInfo(GetGrabTicketTaskConfigInfoReq) returns (GetGrabTicketTaskConfigInfoReply) {
    option (google.api.http) = {get: "/yanxue/api/shadow/v1/grab_ticket_task_config/info"};
  }
  //研学抢票任务配置表-列表数据查询
  rpc GetGrabTicketTaskConfigList(GetGrabTicketTaskConfigListReq) returns (GetGrabTicketTaskConfigListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_task_config/list"
      body: "*"
    };
  }
  //研学抢票任务配置表-更新状态
  rpc UpdateGrabTicketTaskConfigStatus(UpdateGrabTicketTaskConfigStatusReq) returns (UpdateGrabTicketTaskConfigReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/grab_ticket_task_config/update_status"
      body: "*"
    };
  }
}

//请求-研学抢票任务配置表-更新状态
message UpdateGrabTicketTaskConfigStatusReq {
  string id = 1; // id
  string status = 2; // 状态
}

//响应-研学抢票任务配置表-更新状态
message UpdateGrabTicketTaskConfigStatusReply {}

message GrabTicketUserInfo {
  string name = 1; // 姓名
  string idCard = 2; // 身份证号
  string phone = 3; // 手机号码
}

//研学抢票任务配置表信息
message GrabTicketTaskConfigInfo {
  string id = 1; // id
  string siteConfigId = 2; // 站点配置ID
  string session = 3; // 场次
  string venue = 4; // 场馆
  string timeSlot = 5; // 时间段
  string priority = 6; // 优先级
  int32 maxRetries = 7; // 最大重试次数
  int32 retryCount = 8; // 重试次数
  repeated GrabTicketUserInfo userInfo = 9; // 用户信息
  string ticketType = 10; // 票种类型
  string visitDate = 11; // 参观日期
  int32 preExecuteTimeGap = 12; // 预执行提前时间（毫秒）
  bool enableRetry = 13; // 是否启用循环执行
  int32 retryTimeGap = 14; // 循环间隔（毫秒）
  string status = 15; // 状态
  string taskName = 16; // 任务名称
  string createdAt = 17; // 创建时间
  string updatedAt = 18; // 更新时间
}

//请求-研学抢票任务配置表-创建一条数据
message CreateGrabTicketTaskConfigReq {
  string siteConfigId = 1; // 站点配置ID
  string session = 2; // 场次
  string venue = 3; // 场馆
  string timeSlot = 4; // 时间段
  string priority = 5; // 优先级
  int32 maxRetries = 6; // 最大重试次数
  int32 retryCount = 7; // 重试次数
  repeated GrabTicketUserInfo userInfo = 8; // 用户信息
  string ticketType = 9; // 票种类型
  string visitDate = 10; // 参观日期
  int32 preExecuteTimeGap = 11; // 预执行提前时间（毫秒）
  bool enableRetry = 12; // 是否启用循环执行
  int32 retryTimeGap = 13; // 循环间隔（毫秒）
  string status = 14; // 状态
  string taskName = 15; // 任务名称
}

//响应-研学抢票任务配置表-创建一条数据
message CreateGrabTicketTaskConfigReply {
  string id = 1; // id
}

//请求-研学抢票任务配置表-更新一条数据
message UpdateGrabTicketTaskConfigReq {
  string id = 1; // id
  string siteConfigId = 2; // 站点配置ID
  string session = 3; // 场次
  string venue = 4; // 场馆
  string timeSlot = 5; // 时间段
  string priority = 6; // 优先级
  int32 maxRetries = 7; // 最大重试次数
  int32 retryCount = 8; // 重试次数
  repeated GrabTicketUserInfo userInfo = 9; // 用户信息
  string ticketType = 10; // 票种类型
  string visitDate = 11; // 参观日期
  int32 preExecuteTimeGap = 12; // 预执行提前时间（毫秒）
  bool enableRetry = 13; // 是否启用循环执行
  int32 retryTimeGap = 14; // 循环间隔（毫秒）
  string status = 15; // 状态
  string taskName = 16; // 任务名称
}

//响应-研学抢票任务配置表-更新一条数据
message UpdateGrabTicketTaskConfigReply {}

//请求-研学抢票任务配置表-删除单条数据
message DeleteGrabTicketTaskConfigReq {
  string id = 1; // id
}

//响应-研学抢票任务配置表-删除多条数据
message DeleteGrabTicketTaskConfigReply {}

//请求-研学抢票任务配置表-单条数据查询
message GetGrabTicketTaskConfigInfoReq {
  string id = 1; // id
}

//响应-研学抢票任务配置表-单条数据查询
message GetGrabTicketTaskConfigInfoReply {
  GrabTicketTaskConfigInfo info = 1;
}

//请求-研学抢票任务配置表-列表数据查询
message GetGrabTicketTaskConfigListReq {
  int32 page = 1; //页码
  int32 pageSize = 2; //页数
  string siteConfigId = 3; // 站点配置ID
}

//响应-研学抢票任务配置表-列表数据查询
message GetGrabTicketTaskConfigListReply {
  int32 total = 1; //总数
  repeated GrabTicketTaskConfigInfo list = 2; // 列表数据
}
