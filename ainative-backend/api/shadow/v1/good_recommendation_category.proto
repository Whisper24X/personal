syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//商品推荐分类表
service GoodRecommendationCategory {
  //商品推荐分类表-创建一条数据
  rpc CreateGoodRecommendationCategory(CreateGoodRecommendationCategoryReq) returns (CreateGoodRecommendationCategoryReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/good_recommendation_category/create"
      body: "*"
    };
  }
  //商品推荐分类表-更新一条数据
  rpc UpdateGoodRecommendationCategory(UpdateGoodRecommendationCategoryReq) returns (UpdateGoodRecommendationCategoryReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/good_recommendation_category/update"
      body: "*"
    };
  }
  //商品推荐分类表-修改上架状态
  rpc UpdateGoodRecommendationCategoryStatus(UpdateGoodRecommendationCategoryStatusReq) returns (UpdateGoodRecommendationCategoryStatusReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/good_recommendation_category/updateStatus"
      body: "*"
    };
  }
  //商品推荐分类表-单条数据查询
  rpc GetGoodRecommendationCategoryInfo(GetGoodRecommendationCategoryInfoReq) returns (GetGoodRecommendationCategoryInfoReply) {
    option (google.api.http) = {get: "/yanxue/api/shadow/v1/good_recommendation_category/info"};
  }
  //商品推荐分类表-列表数据查询
  rpc GetGoodRecommendationCategoryList(GetGoodRecommendationCategoryListReq) returns (GetGoodRecommendationCategoryListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/good_recommendation_category/list"
      body: "*"
    };
  }
  //商品推荐分类表-更新商品数据
  rpc UpdateGoodRecommendationGoodItems(UpdateGoodRecommendationGoodItemsReq) returns (UpdateGoodRecommendationGoodItemsReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/good_recommendation_category/updateGoodItems"
      body: "*"
    };
  }
}

//请求-商品推荐分类表-更新商品数据
message UpdateGoodRecommendationGoodItemsReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
  repeated StoreGoodItem goodItems = 2; // 商品内容JSON数组，格式：[{"goodId": "uuid", "sortOrder": 1}]
}

//响应-商品推荐分类表-更新商品数据
message UpdateGoodRecommendationGoodItemsReply {}

message GoodItem {
  string goodId = 1; // 商品id
  int32 sortOrder = 2; // 排序号，数字越小排序越靠前
  string goodName = 3; // 商品名称
  string mainImage = 4; // 主图URL
  int32 price = 5; // 价格：单位分
  bool isShowInHomepage = 6; // 是否在首页展示
}

message StoreGoodItem {
  string goodId = 1; // 商品id
  int32 sortOrder = 2; // 排序号，数字越小排序越靠前
  bool isShowInHomepage = 3; // 是否在首页展示
}

//商品推荐分类表信息
message GoodRecommendationCategoryInfo {
  string id = 1; // id
  string name = 2; // 分类名称
  string icon = 3; // 分类图标URL
  int32 status = 4; // 状态：-1-下架，1-上架
  int32 sortOrder = 5; // 排序号，数字越小排序越靠前
  repeated GoodItem goodItems = 6; // 商品内容JSON数组，格式：[{"goodId": "uuid", "sortOrder": 1}]
  string createdAt = 7; // 创建时间
  string updatedAt = 8; // 更新时间
  string updatedBy = 9; // 最后修改人
  string updatedByName = 10; // 最后修改人名称
}

//请求-商品推荐分类表-创建一条数据
message CreateGoodRecommendationCategoryReq {
  string name = 1 [(validate.rules).string = {min_len: 1}]; // 分类名称
  string icon = 2 [(validate.rules).string = {min_len: 1}]; // 分类图标URL
  int32 sortOrder = 3; // 排序号，数字越小排序越靠前
  repeated StoreGoodItem goodItems = 4; // 商品内容JSON数组，格式：[{"goodId": "uuid", "sortOrder": 1}]
}

//响应-商品推荐分类表-创建一条数据
message CreateGoodRecommendationCategoryReply {
  string id = 1; // id
}

//请求-商品推荐分类表-更新一条数据
message UpdateGoodRecommendationCategoryReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
  string name = 2 [(validate.rules).string = {min_len: 1}]; // 分类名称
  string icon = 3 [(validate.rules).string = {min_len: 1}]; // 分类图标URL
  int32 sortOrder = 4; // 排序号，数字越小排序越靠前
}

//响应-商品推荐分类表-更新一条数据
message UpdateGoodRecommendationCategoryReply {}

//请求-商品推荐分类表-修改上架状态
message UpdateGoodRecommendationCategoryStatusReq {
  string id = 1; // id
  int32 status = 2; // 状态：-1-下架，1-上架
}

//响应-商品推荐分类表-修改上架状态
message UpdateGoodRecommendationCategoryStatusReply {}

//请求-商品推荐分类表-单条数据查询
message GetGoodRecommendationCategoryInfoReq {
  string id = 1; // id
}

//响应-商品推荐分类表-单条数据查询
message GetGoodRecommendationCategoryInfoReply {
  GoodRecommendationCategoryInfo info = 1;
}

//请求-商品推荐分类表-列表数据查询
message GetGoodRecommendationCategoryListReq {
  int32 page = 1; //页码
  int32 pageSize = 2; //页数
}

//响应-商品推荐分类表-列表数据查询
message GetGoodRecommendationCategoryListReply {
  int32 total = 1; //总数
  repeated GoodRecommendationCategoryInfo list = 2; // 列表数据
}
