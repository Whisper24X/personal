syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shadow/v1/user_wx.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//用户
service User {
  //用户-列表数据查询
  rpc GetUserList(GetUserListReq) returns (GetUserListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/user/list"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //用户-详情数据查询
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/user/info"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //用户-修改状态
  rpc UpdateUserStatus(UpdateUserStatusReq) returns (UpdateUserStatusReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/user/update_status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //用户-删除账号
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/user/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //用户-解绑微信
  rpc UnbindUserWx(UnbindUserWxReq) returns (UnbindUserWxReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/user/unbind_user_wx"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
}

//用户信息
message UserInfo {
  string id = 1; // id
  string phone = 2; // 手机号
  string nickname = 3; // 昵称
  string avatar = 4; // 头像
  string address = 5; // 地址
  string birthday = 6; // 生日
  int32 status = 7; // -1=禁用 1=开启
  string createdAt = 8; // 创建时间
  string updatedAt = 9; // 更新时间
  UserWxInfo userWxInfo = 10; // 用户微信信息
}

//请求-用户-列表数据查询
message GetUserListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(validate.rules).int32 = {gte: 1}]; //页码
  int32 pageSize = 2 [(validate.rules).int32 = {
    gte: 1
    lte: 1000
  }]; //页数
  string phone = 3; // 手机号
}

//响应-用户-列表数据查询
message GetUserListReply {
  int32 total = 1; //总数
  repeated UserInfo list = 2; // 列表数据
}

message GetUserInfoReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
}

message GetUserInfoReply {
  UserInfo userInfo = 1; // 用户信息
}

message UpdateUserStatusReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
  int32 status = 2 [(validate.rules).int32 = {
    in: [
      -1,
      1
    ]
  }]; // 状态 -1=禁用 1=开启
}

message UpdateUserStatusReply {}

message DeleteUserReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
}

message DeleteUserReply {}

message UnbindUserWxReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
}

message UnbindUserWxReply {}
