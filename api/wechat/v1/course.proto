syntax = "proto3";

package wechat.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/wechat/v1;v1";

// 课程
service Course {
  // 课程-通过课程查询可以预约的日期和时间段
  rpc GetCourseStockSelector(GetCourseStockSelectorReq) returns (GetCourseStockSelectorReply) {
    option (google.api.http) = {get: "/yanxue/wechat/v1/course/stock/selector"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 课程-查询课程预约记录列表
  rpc GetCourseAppointmentList(GetCourseAppointmentListReq) returns (GetCourseAppointmentListReply) {
    option (google.api.http) = {get: "/yanxue/wechat/v1/course/appointment/record"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 课程-查询课程预约记录信息
  rpc GetCourseAppointmentInfo(GetCourseAppointmentInfoReq) returns (GetCourseAppointmentInfoReply) {
    option (google.api.http) = {get: "/yanxue/wechat/v1/course/appointment/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 课程-预约
  rpc CreateCourseAppointment(CreateCourseAppointmentReq) returns (CreateCourseAppointmentReply) {
    option (google.api.http) = {
      post: "/yanxue/wechat/v1/course/appointment/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 课程-更新预约
  rpc UpdateCourseAppointment(UpdateCourseAppointmentReq) returns (UpdateCourseAppointmentReply) {
    option (google.api.http) = {
      post: "/yanxue/wechat/v1/course/appointment/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 课程-取消预约
  rpc CancelCourseAppointment(CancelCourseAppointmentReq) returns (CancelCourseAppointmentReply) {
    option (google.api.http) = {
      post: "/yanxue/wechat/v1/course/appointment/cancel"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  // 通过预约ID查询群聊二维码
  rpc GetGroupQrCodeByAppointmentId(GetGroupQrCodeByAppointmentIdReq) returns (GetGroupQrCodeByAppointmentIdReply) {
    option (google.api.http) = {get: "/yanxue/wechat/v1/course/appointment/getGroupQrCodeByAppointmentId"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
}

//请求-通过预约ID查询群聊二维码
message GetGroupQrCodeByAppointmentIdReq {
  string appointmentId = 1;
}

//响应-通过预约ID查询群聊二维码
message GetGroupQrCodeByAppointmentIdReply {
  string groupQrCode = 1; // 群聊二维码
}

//信息
message CourseInfo {
  string id = 1; // id
  string courseName = 2; // 课程名称
  string mainImage = 3; // 主图(多张)
  string detailImages = 4; // 详情图(多张)
  float price = 5; // 价格
  string status = 6; // 状态
  string createdAt = 7; // 开始时间
  string updatedAt = 8; // 更新时间
  string updatedBy = 9; // 更新人
}

//课程-库存信息
message CourseStockInfo {
  string id = 1; // id
  string courseId = 2; // 课程Id
  string date = 3; // 课程日期 格式：2025-01-01
  string period = 4; // 课程时间 格式：10:00-12:00
  int32 stock = 5; // 库存
  string status = 6; // 状态 上架putOn 下架putOff
  string createdAt = 7; // 开始时间
  string updatedAt = 8; // 更新时间
  string updatedBy = 9; // 更新人
  string updatedByName = 10; // 更新人名称
  string courseName = 11; // 课程名称
  int32 stockRemain = 12; // 剩余库存
}

//课程-预约信息
message CourseAppointmentInfo {
  string id = 1; // id
  string orderId = 2; // 订单id
  string goodId = 3; // 商品id
  string categoryId = 4; // 课程分类id
  string courseId = 5; // 课程id
  string date = 6; // 预约日期
  string period = 7; // 预约时段
  string studentName = 8; // 学生-名称
  string studentIdentityCard = 9; // 学生-身份证
  string studentSex = 10; // 学生-性别(男M,女F)
  int32 studentAge = 11; // 学生-年龄
  string parentName = 12; // 家长-姓名
  string parentPhone = 13; // 家长-手机号
  string parentAccompany = 14; // 家长-是否陪同 yes 是 no 否 unknown 未知
  string verificationCode = 15; // 核销卷码
  string status = 16; // 状态  cancel 取消预约 success 已预约 completed 已完成
  string createdAt = 17; // 创建时间
  string updatedAt = 18; // 更新时间
  string goodName = 19; // 商品名称
  string courseName = 20; // 课程名称
  string parentRemark = 21; // 家长备注
  string courseType = 22; // 课程类型：单日营；多日营；
  string groupQrCode = 23; // 群聊二维码
}

// 课程库存-通过课程查询可以预约的日期和时间段
message CourseStockSelectorItem {
  string date = 1; // 日期 格式：2025-01-01
  string period = 2; // 时间段 格式：10:00-12:00
  int32 stock = 3; // 库存
  int32 stockRemain = 4; // 剩余库存
}

// 请求--通过课程查询可以预约的日期和时间段
message GetCourseStockSelectorReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "courseId",
        "startDate",
        "endDate"
      ]
    }
  };
  string courseId = 1 [(validate.rules).string = {min_len: 1}]; // 课程Id
  string startDate = 2 [(validate.rules).string = {min_len: 1}]; // 开始日期 格式：2025-01-01
  string endDate = 3 [(validate.rules).string = {min_len: 1}]; // 结束日期 格式：2025-02-01
}

// 响应--通过课程查询可以预约的日期和时间段
message GetCourseStockSelectorReply {
  repeated CourseStockSelectorItem items = 1; // 日期和时间段
}

// 请求--课程-查询课程预约记录
message GetCourseAppointmentListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(validate.rules).int32 = {gt: 0}]; // 页码
  int32 pageSize = 2 [(validate.rules).int32 = {gt: 0}]; // 每页条数
  string status = 3; // 状态  cancel 取消预约 success 已预约 completed 已完成
}

// 响应--课程-查询课程预约记录
message GetCourseAppointmentListReply {
  int32 total = 1; // 总条数
  repeated CourseAppointmentInfo list = 2; // 课程预约记录
}

message GetCourseAppointmentInfoReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
}

message GetCourseAppointmentInfoReply {
  CourseAppointmentInfo info = 1; // 课程预约记录信息
}

// 请求--课程-预约
message CreateCourseAppointmentReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "orderId",
        "courseId",
        "date",
        "period",
        "studentName",
        "studentSex",
        "studentAge",
        "parentName",
        "parentPhone",
        "parentAccompany"
      ]
    }
  };
  string orderId = 1 [(validate.rules).string = {min_len: 1}]; // 订单id
  string categoryId = 2 [(validate.rules).string = {min_len: 1}]; // 课程分类id
  string courseId = 3 [(validate.rules).string = {min_len: 1}]; // 课程id
  string date = 4 [(validate.rules).string = {min_len: 1}]; // 预约日期
  string period = 5; // 预约时段
  string studentName = 6 [(validate.rules).string = {min_len: 1}]; // 学生-名称
  string studentIdentityCard = 7; // 学生-身份证
  string studentSex = 8 [(validate.rules).string = {min_len: 1}]; // 学生-性别(男M,女F)
  int32 studentAge = 9 [(validate.rules).int32 = {
    gt: 0
    lt: 100
  }]; // 学生-年龄
  string parentName = 10 [(validate.rules).string = {min_len: 1}]; // 家长-姓名
  string parentPhone = 11 [(validate.rules).string = {min_len: 1}]; // 家长-手机号
  string parentAccompany = 12 [(validate.rules).string = {min_len: 1}]; // 家长-是否陪同 yes 是 no 否 unknown 未知
  string verificationCode = 13; // 核销卷码
  string parentRemark = 14; // 家长备注
}

// 响应--课程-预约
message CreateCourseAppointmentReply {
  string id = 1; // id
}

// 请求--课程-更新预约
message UpdateCourseAppointmentReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
          "id"
          "date"
          "period"
          "studentName"
          "studentSex"
          "studentAge"
          "parentName"
          "parentPhone"
          "parentAccompany"
]
    }
  };
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
  string date = 2 [(validate.rules).string = {min_len: 1}]; // 预约日期
  string period = 3 [(validate.rules).string = {min_len: 1}]; // 预约时段
  string studentName = 4 [(validate.rules).string = {min_len: 1}]; // 学生-名称
  string studentIdentityCard = 5; // 学生-身份证
  string studentSex = 6 [(validate.rules).string = {min_len: 1}]; // 学生-性别(男M,女F)
  int32 studentAge = 7 [(validate.rules).int32 = {
    gt: 0
    lt: 100
  }]; // 学生-年龄
  string parentName = 8 [(validate.rules).string = {min_len: 1}]; // 家长-姓名
  string parentPhone = 9 [(validate.rules).string = {min_len: 1}]; // 家长-手机号
  string parentAccompany = 10 [(validate.rules).string = {min_len: 1}]; // 家长-是否陪同 yes 是 no 否 unknown 未知
  string verificationCode = 11; // 核销卷码
  string parentRemark = 12; // 家长备注
}

// 响应--课程-更新预约
message UpdateCourseAppointmentReply {}

// 请求--课程-取消预约
message CancelCourseAppointmentReq {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // id
}

// 响应--课程-取消预约
message CancelCourseAppointmentReply {}
