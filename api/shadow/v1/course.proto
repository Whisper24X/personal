syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//课程-信息
service Course {
  //课程-信息-创建一条数据
  rpc CreateCourse(CreateCourseReq) returns (CreateCourseReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/course/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-更新一条数据
  rpc UpdateCourse(UpdateCourseReq) returns (UpdateCourseReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/course/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-更新一条数据状态
  rpc UpdateCourseStatus(UpdateCourseStatusReq) returns (UpdateCourseStatusReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/course/updateStatus"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-删除多条数据
  rpc DeleteCourse(DeleteCourseReq) returns (DeleteCourseReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/course/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-单条数据查询
  rpc GetCourseInfo(GetCourseInfoReq) returns (GetCourseInfoReply) {
    option (google.api.http) = {get: "/yanxue/api/shadow/v1/course/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-列表数据查询
  rpc GetCourseList(GetCourseListReq) returns (GetCourseListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/course/list"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //课程-信息-选择器
  rpc GetCourseSelector(GetCourseSelectorReq) returns (GetCourseSelectorReply) {
    option (google.api.http) = {get: "/yanxue/api/shadow/v1/course/selector"};
  }
}

//课程-信息信息
message CourseInfo {
  string id = 1; // id
  string courseName = 2; // 课程名称
  repeated string mainImage = 3; // 主图(多张)
  repeated string detailImages = 4; // 详情图(多张)
  int32 price = 5; // 价格：单位分
  string status = 6; // 状态 上架putOn 下架putOff
  string createdAt = 7; // 开始时间
  string updatedAt = 8; // 更新时间
  string updatedBy = 9; // 更新人
  string updatedByName = 10; // 更新人名称
  string courseType = 11; // 课程类型
  bool isPushContractRequired = 12; // 是否需要推送合同
}

//请求-课程-信息-创建一条数据
message CreateCourseReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "courseName",
        "mainImage",
        "detailImages",
        "price",
        "reservationRules"
      ]
    }
  };
  string courseName = 1 [(validate.rules).string = {min_len: 1}]; // 课程名称
  repeated string mainImage = 2; // 主图(多张)
  repeated string detailImages = 3; // 详情图(多张)
  int32 price = 4; // 价格：单位分
  string courseType = 5; // 课程类型: single:单日营；multi:多日营
  bool isPushContractRequired = 6; // 是否需要推送合同
}

//响应-课程-信息-创建一条数据
message CreateCourseReply {
  string id = 1; // id
}

//请求-课程-信息-更新一条数据
message UpdateCourseReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "courseName",
        "mainImage",
        "detailImages",
        "price"
      ]
    }
  };
  string id = 1 [(validate.rules).string = {uuid: true}]; // id
  string courseName = 2 [(validate.rules).string = {min_len: 1}]; // 课程名称
  repeated string mainImage = 3; // 主图(多张)
  repeated string detailImages = 4; // 详情图(多张)
  int32 price = 5; // 价格：单位分
  bool isPushContractRequired = 6; // 是否需要推送合同
}

//响应-课程-信息-更新一条数据
message UpdateCourseReply {}

//请求-课程-信息-更新状态
message UpdateCourseStatusReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "ids",
        "status"
      ]
    }
  };
  repeated string ids = 1 [(validate.rules).repeated = {min_items: 1}]; // id集合
  string status = 2 [(validate.rules).string = {min_len: 1}]; // 状态 上架putOn 下架putOff
}

//响应-课程-信息-更新状态
message UpdateCourseStatusReply {}

//请求-课程-信息-删除多条数据
message DeleteCourseReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["ids"]
    }
  };
  repeated string ids = 1 [(validate.rules).repeated = {min_items: 1}]; // id集合
}

//响应-课程-信息-删除多条数据
message DeleteCourseReply {}

//请求-课程-信息-单条数据查询
message GetCourseInfoReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(validate.rules).string = {uuid: true}]; // id
}

//响应-课程-信息-单条数据查询
message GetCourseInfoReply {
  CourseInfo info = 1;
}

//请求-课程-信息-列表数据查询
message GetCourseListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(validate.rules).int32 = {gt: 0}]; //页码
  int32 pageSize = 2 [(validate.rules).int32 = {gt: 0}]; //页数
  string courseName = 3; // 名称
  string status = 4; // 状态 上架putOn 下架putOff
  string courseType = 5; // 课程类型：single:单日营；multi:多日营
}

//响应-课程-信息-列表数据查询
message GetCourseListReply {
  int32 total = 1; //总数
  repeated CourseInfo list = 2; // 列表数据
}

message CourseSelector {
  string id = 1; // id
  string courseName = 2; // 课程名称
  string courseType = 3; // 课程类型
}

//请求-课程-信息-选择器
message GetCourseSelectorReq {
  string courseName = 1; // 课程名称
  string courseType = 2; // 课程类型
}

//响应-课程-信息-选择器
message GetCourseSelectorReply {
  repeated CourseSelector list = 1; // 列表数据
}
