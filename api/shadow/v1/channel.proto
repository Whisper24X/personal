syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//渠道
service Channel {
  //渠道-列表数据查询
  rpc GetChannelList(GetChannelListReq) returns (GetChannelListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/channel/list"
      body: "*"
    };
  }
}

message GetChannelListReq {}

message ChannelInfo {
  string id = 1; // id
  string name = 2; // 名称
  string verificationCodeType = 3; // 渠道卷码类型none:无卷码required:必须optional:可有可无
}

message GetChannelListReply {
  repeated ChannelInfo list = 1; // 列表数据
}
