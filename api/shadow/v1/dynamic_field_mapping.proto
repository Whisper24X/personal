syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";

//动态字段映射关系表
service DynamicFieldMapping {
  //动态字段映射关系表-创建/更新一条数据
  rpc UpsertDynamicFieldMapping(UpsertDynamicFieldMappingReq) returns (UpsertDynamicFieldMappingReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/dynamic_field_mapping/upsert"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //动态字段映射关系表-列表数据查询
  rpc GetDynamicFieldMappingList(GetDynamicFieldMappingListReq) returns (GetDynamicFieldMappingListReply) {
    option (google.api.http) = {
      post: "/yanxue/api/shadow/v1/dynamic_field_mapping/list"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
}

//动态字段映射关系表信息
message DynamicFieldMappingInfo {
  string id = 1; // id
  string channel = 2; // 渠道名称
  string mappingType = 3; // 映射类型：field；enum;
  repeated DynamicFieldMappingItem data = 4; // 配置数据
}

message DynamicFieldMappingItem {
  string sysDynamicFieldName = 1;
  string csvDynamicFieldName = 2;
}

//请求-动态字段映射关系表-创建一条数据
message UpsertDynamicFieldMappingReq {
  string id = 1; // id
  string channel = 2; // 渠道名称
  string mappingType = 3; // 映射类型：field；enum; serviceStatusEnum;
  repeated DynamicFieldMappingItem data = 4; // 配置数据
}

//响应-动态字段映射关系表-创建一条数据
message UpsertDynamicFieldMappingReply {
  string id = 1; // id
}

//请求-动态字段映射关系表-列表数据查询
message GetDynamicFieldMappingListReq {
  int32 page = 1; //页码
  int32 pageSize = 2; //页数
  string channel = 3 [(validate.rules).string = {min_len: 1}]; // 渠道名称
}

//响应-动态字段映射关系表-列表数据查询
message GetDynamicFieldMappingListReply {
  int32 total = 1; //总数
  repeated DynamicFieldMappingInfo list = 2; // 列表数据
}
