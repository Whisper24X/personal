syntax = "proto3";

package shadow.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/yanxue/api/shadow/v1;v1";
// 变量的命名一律使用小驼峰命名法，例如：firstName、lastName等。
// 后缀定义:请求req,响应reply

// 操作日志
service SysOperationLog {
  //操作日志-列表
  rpc SysOperationLogList(SysOperationLogListReq) returns (SysOperationLogListResp) {
    option (google.api.http) = {get: "/yanxue/shadow/v1/sysOperationLog/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "TOKEN"
          type: STRING
          required: true
        }
      }
    };
  }
  //操作日志-保存
  rpc SysOperationLogStore(SysOperationLogStoreReq) returns (SysOperationLogStoreResp) {}
}

//操作日志-信息
message SysOperationLogInfo {
  string id = 1; // 编号
  string adminId = 2; // 管理员Id
  string username = 3; // 账号
  string ip = 4; // IP
  string uri = 5; // 请求路径
  string uriDesc = 6; // 请求描述
  string useragent = 7; // 浏览器标识
  string req = 8; // 请求数据
  string resp = 9; // 响应数据
  string createdAt = 10; // 创建时间
}

//操作日志-列表-请求
message SysOperationLogListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(validate.rules).int32 = {gt: 0}]; //页码
  int32 pageSize = 2 [(validate.rules).int32 = {
    gt: 0
    lt: 100
  }]; //每页数量
  string adminId = 3; // 管理员Id
  string ip = 4; // IP
  string uri = 5; // 请求路径
  string startDate = 6; // 开始时间
  string endDate = 7; // 结束时间
}

//操作日志-列表-响应
message SysOperationLogListResp {
  int32 total = 1; // 总条数
  repeated SysOperationLogInfo list = 2; //管理员列表
}

//操作日志-保存-请求
message SysOperationLogStoreReq {
  string adminId = 1; // 管理员Id
  string ip = 2; // IP
  string method = 3; // IP
  string uri = 4; // 请求路径
  string useragent = 5; // 浏览器标识
  string header = 6; // 浏览器header
  string req = 7; // 请求数据
  string resp = 8; // 响应数据
}

//操作日志-保存-响应
message SysOperationLogStoreResp {}
