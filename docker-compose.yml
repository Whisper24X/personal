networks:
  ainative:
    driver: bridge

volumes:
  ainative-volume-postgresql:
    external: true
  ainative-volume-redis:
    external: true

services:
  ainative-postgresql:
    image: postgres:14.5
    container_name: ainative-postgresql                                                        # 容器名为'postgresql'
    # 重启策略
    restart: always               # 指定容器退出后的重启策略为始终重启，但是不考虑在Docker守护进程启动时就已经停止了的容器
    # 设置环境变量,相当于docker run命令中的-e
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_postgres_password_here
      ALLOW_IP_RANGE: 0.0.0.0/0 # 允许所有ip访问
    # 数据卷挂载路径设置,使用外部存储卷
    volumes:
      - "ainative-volume-postgresql:/var/lib/postgresql/data"
    # 映射端口
    ports:
      - "5432:5432"
    networks:
      - ainative
  ainative-redis:
    container_name: ainative-redis
    image: 'redis:6.2.13-alpine'
    restart: always
    environment:
      - TZ=Asia/Shanghai
    command: [ "redis-server", "--appendonly", "yes", "--requirepass","your_redis_password_here" ]
    volumes:
      - "ainative-volume-redis:/data:rw"
    ports:
      - "6379:6379"
    networks:
      - ainative
  ainative-backend:
    image: your_docker_registry_here/your_namespace_here/ainative-backend:your_tag_here
    container_name: ainative-backend
    restart: always
    ports:
      - "8000:8000"
      - "9000:9000"
    networks:
      - ainative
  ainative-frontend:
    image: your_docker_registry_here/your_namespace_here/ainative-frontend:your_tag_here
    container_name: ainative-admin
    restart: always
    ports:
      - "8090:8080"
    networks:
      - ainative