networks:
  ainative:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:14-alpine
    container_name: ainative-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ainative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host 5432 常被本机其它 Postgres 占用；映射到 5433 避免冲突
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ainative"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ainative

  redis:
    image: redis:6-alpine
    container_name: ainative-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ainative

  backend:
    image: ainative/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ainative-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.${NODE_ENV:?NODE_ENV is required}
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      AINATIVE_DATA_ROOT_DIR: ${PWD}/tmp
      # 使用 compose 内 postgres，避免宿主机 .env 指向外网库导致启动失败
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "123456"
      DATABASE_NAME: ainative
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tmp:/usr/src/tmp
      - ${PWD}/tmp:${PWD}/tmp
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9000/').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ainative

  frontend:
    image: ainative/frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ainative-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - ainative
