networks:
  ainative:
    driver: bridge

volumes:
  ainative-postgres-data:
  ainative-redis-data:

services:
  postgres:
    image: postgres:14-alpine
    container_name: ainative-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ainative-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ainative

  redis:
    image: redis:6-alpine
    container_name: ainative-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ainative-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ainative

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ainative-backend
    restart: unless-stopped
    env_file: ./backend/.env.development
    environment:
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_HOST: redis://:${REDIS_PASSWORD}@redis:6379/1
      SSH_AUTH_SOCK: /ssh-agent
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ${SSH_AUTH_SOCK}:/ssh-agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9000/').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ainative

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ainative-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - ainative
