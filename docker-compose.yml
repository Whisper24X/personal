networks:
  ainative:
    driver: bridge

services:
  backend:
    image: ainative/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ainative-backend
    restart: unless-stopped
    env_file: ./backend/.env.development
    environment:
      AINATIVE_DATA_ROOT_DIR: ${PWD}/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tmp:/usr/src/tmp
      - ${PWD}/tmp:${PWD}/tmp
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9000/').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ainative

  frontend:
    image: ainative/frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ainative-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"
    networks:
      - ainative
