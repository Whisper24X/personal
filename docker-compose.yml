x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  LANG: ${LANG:-C.UTF-8}
  NODE_ENV: ${NODE_ENV:-production}
  APP_PORT: 3000
  APP_NAME: ${APP_NAME:-AINative API}
  API_PREFIX: ${API_PREFIX:-api}
  APP_FALLBACK_LANGUAGE: ${APP_FALLBACK_LANGUAGE:-en}
  APP_HEADER_LANGUAGE: ${APP_HEADER_LANGUAGE:-x-custom-lang}
  FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:${FRONTEND_PORT:-8090}}
  BACKEND_DOMAIN: ${BACKEND_DOMAIN:-http://localhost:${BACKEND_PORT:-8000}}
  DATABASE_TYPE: postgres
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  DATABASE_NAME: ${POSTGRES_DB:-ainative}
  DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-100}
  DATABASE_SSL_ENABLED: ${DATABASE_SSL_ENABLED:-false}
  DATABASE_REJECT_UNAUTHORIZED: ${DATABASE_REJECT_UNAUTHORIZED:-false}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-secret}
  AUTH_JWT_TOKEN_EXPIRES_IN: ${AUTH_JWT_TOKEN_EXPIRES_IN:-15m}
  AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:-secret_for_refresh}
  AUTH_REFRESH_TOKEN_EXPIRES_IN: ${AUTH_REFRESH_TOKEN_EXPIRES_IN:-3650d}
  AINATIVE_DISPATCH_INTERVAL_MS: ${AINATIVE_DISPATCH_INTERVAL_MS:-1000}
  AINATIVE_NODE_LEASE_TTL_MS: ${AINATIVE_NODE_LEASE_TTL_MS:-45000}
  AINATIVE_NODE_HEARTBEAT_INTERVAL_MS: ${AINATIVE_NODE_HEARTBEAT_INTERVAL_MS:-10000}
  AINATIVE_STALE_RECOVERY_INTERVAL_MS: ${AINATIVE_STALE_RECOVERY_INTERVAL_MS:-15000}
  AINATIVE_RETENTION_CLEANUP_INTERVAL_MS: ${AINATIVE_RETENTION_CLEANUP_INTERVAL_MS:-3600000}
  AINATIVE_STREAM_DB_POLL_INTERVAL_MS: ${AINATIVE_STREAM_DB_POLL_INTERVAL_MS:-1000}
  AINATIVE_GIT_RUNTIME_ENABLED: ${AINATIVE_GIT_RUNTIME_ENABLED:-false}
  AINATIVE_AGENT_RUNNER_ENABLED: ${AINATIVE_AGENT_RUNNER_ENABLED:-false}
  AINATIVE_REPO_CACHE_BASE_DIR: ${AINATIVE_REPO_CACHE_BASE_DIR:-}
  AINATIVE_WORKTREE_BASE_DIR: ${AINATIVE_WORKTREE_BASE_DIR:-}
  AINATIVE_WORKTREE_ALLOWED_ROOT: ${AINATIVE_WORKTREE_ALLOWED_ROOT:-}
  AINATIVE_DATA_ROOT_DIR: ${AINATIVE_DATA_ROOT_DIR:-}
  AINATIVE_CODEX_RUNNER_COMMAND: ${AINATIVE_CODEX_RUNNER_COMMAND:-}
  AINATIVE_CLAUDE_RUNNER_COMMAND: ${AINATIVE_CLAUDE_RUNNER_COMMAND:-}
  AINATIVE_GEMINI_RUNNER_COMMAND: ${AINATIVE_GEMINI_RUNNER_COMMAND:-}
  AINATIVE_OPENCODE_RUNNER_COMMAND: ${AINATIVE_OPENCODE_RUNNER_COMMAND:-}
  AINATIVE_CURSOR_RUNNER_COMMAND: ${AINATIVE_CURSOR_RUNNER_COMMAND:-}
  AINATIVE_SMTP_HOST: ${AINATIVE_SMTP_HOST:-}
  AINATIVE_SMTP_PORT: ${AINATIVE_SMTP_PORT:-25}
  AINATIVE_SMTP_SECURE: ${AINATIVE_SMTP_SECURE:-false}
  AINATIVE_SMTP_USER: ${AINATIVE_SMTP_USER:-}
  AINATIVE_SMTP_PASS: ${AINATIVE_SMTP_PASS:-}
  AINATIVE_SMTP_FROM: ${AINATIVE_SMTP_FROM:-}
  WORKER_HOST: ${WORKER_HOST:-redis://:${REDIS_PASSWORD:-redis}@redis:6379/1}
  AINATIVE_RUN_SEED: ${AINATIVE_RUN_SEED:-true}

networks:
  ainative:
    driver: bridge

volumes:
  ainative-postgres-data:
  ainative-redis-data:

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: ainative-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-ainative}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ainative-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ainative}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ainative

  redis:
    image: redis:7-alpine
    container_name: ainative-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    volumes:
      - ainative-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ainative

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ainative-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ainative

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ainative-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - ainative
