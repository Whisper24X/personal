networks:
  ainative:
    driver: bridge

volumes:
  ainative-postgres-data:
  ainative-redis-data:

services:
  postgres:
    image: postgres:14-alpine
    container_name: ainative-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-ainative}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ainative-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ainative}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ainative

  redis:
    image: redis:6-alpine
    container_name: ainative-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    volumes:
      - ainative-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ainative

  adminer:
    image: adminer
    container_name: ainative-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ainative

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ainative-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - ainative
