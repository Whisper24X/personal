<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>被测页面 - Page Agent Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.secondary {
      background: #fff;
      color: #333;
    }
    .checkbox-group {
      margin: 1rem 0;
    }
    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: normal;
      cursor: pointer;
    }
    #result {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: #f5f5f5;
      border-radius: 4px;
      font-size: 0.9rem;
      min-height: 2rem;
    }
  </style>
</head>
<body>
  <h1>登录 / 表单演示页</h1>

  <form id="loginForm" aria-label="登录表单">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" />
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" />
    </div>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" id="remember" name="remember" /> 记住我
      </label>
    </div>
    <div class="form-group">
      <label for="role">角色</label>
      <select id="role" name="role">
        <option value="">请选择</option>
        <option value="admin">管理员</option>
        <option value="user">普通用户</option>
        <option value="guest">访客</option>
      </select>
    </div>
    <div class="actions">
      <button type="submit" id="loginBtn">登录</button>
      <button type="button" id="resetBtn" class="secondary">重置</button>
      <button type="button" id="submitBtn" class="secondary">提交</button>
    </div>
  </form>

  <div id="result" aria-live="polite"></div>

  <script>
    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');
    const resetBtn = document.getElementById('resetBtn');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      result.textContent = '已点击登录。用户名: ' + (username || '(空)') + ', 密码: ' + (password ? '***' : '(空)');
    });

    resetBtn.addEventListener('click', function () {
      form.reset();
      result.textContent = '已重置表单';
    });

    submitBtn.addEventListener('click', function () {
      result.textContent = '已点击提交按钮';
    });
  </script>
</body>
</html>
