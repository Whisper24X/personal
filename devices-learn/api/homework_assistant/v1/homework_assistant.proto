syntax = "proto3";

package api.homework_assistant.v1;

import "descriptor/descriptor.proto";
import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "gitlab.yc345.tv/backend/devices-learn/api/homework_assistant/v1;v1";

service HomeworkAssistant {
  // 异步批量搜题
  rpc BatchSearchQuestionAsync(BatchSearchQuestionRequest) returns (BatchSearchQuestionReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/batchSearchQuestionAsync"
      body: "*"
    };
    option (descriptor.api_tag) = {
      header_has_sn: true
      header_has_uid: true
    };
  }

  // 搜题
  rpc SearchQuestion(SearchQuestionRequest) returns (SearchQuestionReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/searchQuestion"
      body: "*"
    };
    option (descriptor.api_tag) = {
      header_has_sn: true
      header_has_uid: true
    };
  }
  // 查询搜题结果
  rpc QuerySearchResultById(QuerySearchResultByIdRequest) returns (QuerySearchResultByIdReply) {
    option (google.api.http) = {get: "/devices-learn/homework-assistant/v1/querySearchResultById"};
  }
  // 查询搜题记录列表
  rpc QuerySearchRecordList(QuerySearchRecordListRequest) returns (QuerySearchRecordListReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/querySearchRecordList"
      body: "*"
    };
  }
  // 注册设备
  rpc RegisterSearchDevices(RegisterSearchDevicesRequest) returns (RegisterSearchDevicesReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/registerSearchDevices"
      body: "*"
    };
  }

  // 作业批改(压测）
  rpc HomeworkFullPageCorrection(FullPageCorrectionRequest) returns (FullPageCorrectionReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/homeworkFullPageCorrection"
      body: "*"
    };
  }

  // 作业批改结果查询（压测）
  rpc QueryHomeworkFullPageCorrectionDetailById(FullPageCorrectionDetailRequest) returns (FullPageCorrectionDetailReply) {
    option (google.api.http) = {get: "/devices-learn/homework-assistant/v1/queryHomeworkFullPageCorrectionDetailById"};
  }

  // 题目批改结果修改
  rpc UpdateQuestionCorrectionResult(CorrectionResultRequest) returns (CorrectionResultReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/updateQuestionCorrectionResult"
      body: "*"
    };
  }

  // 查询批改记录列表（压测）
  rpc QueryCorrectionRecordList(QueryCorrectionRecordListRequest) returns (QueryCorrectionRecordListReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/queryCorrectionRecordList"
      body: "*"
    };
  }

  // 查询知识点名称推荐视频
  rpc QueryRecommendTopicsSearch(TopicSearchRequest) returns (TopicSearchReply) {
    option (google.api.http) = {get: "/devices-learn/homework-assistant/v1/queryRecommendTopics"};
  }

  // 查询作业任务所属错题数量
  rpc QueryHomeworkTaskWrongQuestionCount(QueryHomeworkTaskWrongQuestionCountRequest) returns (QueryHomeworkTaskWrongQuestionCountReply) {
    option (google.api.http) = {get: "/devices-learn/homework-assistant/v1/queryHomeworkTaskWrongQuestionCount"};
    option (descriptor.api_tag) = {header_has_uid: true};
  }

  // 保存错题订正记录
  rpc StoreWrongQuestionRectificationInfo(RectificationRequest) returns (RectificationReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/storeHomeworkTaskWrongQuestionRectificationInfo"
      body: "*"
    };
    option (descriptor.api_tag) = {
      header_has_sn: true
      header_has_uid: true
    };
  }

  // 查询订正记录详情（压测）
  rpc QueryHomeworkTaskWrongQuestionRectificationInfo(RectificationInfoRequest) returns (RectificationInfoReply) {
    option (google.api.http) = {get: "/devices-learn/homework-assistant/v1/queryHomeworkTaskWrongQuestionRectificationInfo"};
  }

  // 查询作业助手报告
  rpc QueryHomeworkAssistantReport(QueryHomeworkAssistantReportRequest) returns (QueryHomeworkAssistantReportReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/queryHomeworkAssistantReport"
      body: "*"
    };
  }

  // 作业助手积分-任务完成
  rpc StoreHomeworkAssistantTaskScore(StoreHomeworkAssistantTaskScoreRequest) returns (StoreHomeworkAssistantTaskScoreReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/storeHomeworkAssistantTaskScore"
      body: "*"
    };
  }

  // 作业助手积分-订正
  rpc StoreHomeworkAssistantRectificationScore(StoreHomeworkAssistantRectificationScoreRequest) returns (StoreHomeworkAssistantRectificationScoreReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/storeHomeworkAssistantRectificationScore"
      body: "*"
    };
  }

  // 作业助手排行榜-查询排行榜信息
  rpc QueryHomeworkAssistantScoreRankList(QueryHomeworkAssistantScoreRankListRequest) returns (QueryHomeworkAssistantScoreRankListReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/queryHomeworkAssistantScoreRankList"
      body: "*"
    };
  }

  // 作业助手排行榜-根据DB数据生成排行榜
  rpc GenerateRankList(GenerateRankListRequest) returns (GenerateRankListReply) {
    option (google.api.http) = {
      post: "/devices-learn/homework-assistant/v1/generateRankList"
      body: "*"
    };
  }
}

message GenerateRankListRequest {}

message GenerateRankListReply {}

message QueryHomeworkAssistantScoreRankListRequest {}

message HomeworkAssistantScoreRankItem {
  int32 rank = 1; // 排名
  string userId = 2; // 用户id
  string userName = 3; // 用户名
  string userAvatar = 4; // 用户头像
  int32 score = 5; // 积分
}

message SelfRankInfo {
  int32 rank = 1; // 排名
  string userId = 2; // 用户id
  string userName = 3; // 用户名
  string userAvatar = 4; // 用户头像
  int32 score = 5; // 积分
  int32 rankChange = 6; // 排名变化
  int32 scoreChange = 7; // 积分变化
}

message QueryHomeworkAssistantScoreRankListReply {
  repeated HomeworkAssistantScoreRankItem rankList = 1; // 排行榜
  SelfRankInfo selfRankInfo = 2; // 用户自己的排名信息
  bool isUseRankFunction = 3; // 是否已开启排行榜
  bool isLastPeriodRankList = 4; // 是否是上期排行榜
}

message HomeworkAssistantScoreDetail {
  string detailType = 1; // 明细类型  任务完成：taskComplete，任务时长：taskDuration，打卡：checkIn
  int32 detailScore = 2; // 明细分数
}

message StoreHomeworkAssistantTaskScoreRequest {
  string taskId = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }]; // 任务Id （保证唯一性）
  int32 taskDuration = 2; // 任务时长(秒)
}

message StoreHomeworkAssistantTaskScoreReply {
  int32 score = 1; // 积分
  repeated HomeworkAssistantScoreDetail scoreDetails = 2; // 积分明细
}

message StoreHomeworkAssistantRectificationScoreRequest {
  string questionTextMd5Sum = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }]; // 问题识别文本的md5值（保证唯一性）
}

message StoreHomeworkAssistantRectificationScoreReply {
  int32 score = 1; // 积分
}

message QueryHomeworkAssistantReportRequest {
  string startDate = 1 [(validate.rules).string = {min_len: 1}];
  string endDate = 2 [(validate.rules).string = {min_len: 1}];
}

message SearchQuestionSummaryItem {
  string subject = 1; // 学科
  int32 count = 2; // 次数
}

message CorrectionSummaryItem {
  int32 correctionTotalCount = 1; // 批改题目总数
  int32 correctionCorrectCount = 2; // 批改正确题目数
  int32 rectificationTotalCount = 3; // 订正题目总数
  int32 rectificationCorrectCount = 4; // 订正正确题目数
}

message SubjectDurationSummaryItem {
  string subject = 1; // 学科
  int32 studyDuration = 2; // 学习时间
}

message DurationSummaryItem {
  int32 totalHomeAssistantDuration = 1; // 累计作业时长
  int32 studyDuration = 2; // 学习时间
  repeated SubjectDurationSummaryItem subjectDurationSummary = 3; // 学科学习时长
}

message TaskSummaryItem {
  int32 totalTasks = 1; // 总任务数
  int32 completedTasks = 2; // 完成任务数
  int32 onTimeTasks = 3; // 按时完成任务数
  int32 overtimeTasks = 4; // 超时完成任务数
  int32 incompleteTasks = 5; // 未完成任务数
}

message HomeworkAssistantReportUserRankInfo {
  int32 rank = 1; // 排名
  string userId = 2; // 用户id
  string userName = 3; // 用户名
  string userAvatar = 4; // 用户头像
  int32 consecutiveCheckInDays = 5; // 连续打卡天数
}

message QueryHomeworkAssistantReportReply {
  int32 todayWrongQuestionCount = 1; // 今日错题数
  repeated SearchQuestionSummaryItem searchQuestionSummary = 2; // 答疑统计
  CorrectionSummaryItem correctionSummaryItem = 3; // 作业批改统计
  DurationSummaryItem durationSummaryItem = 4; // 时长统计
  TaskSummaryItem taskSummaryItem = 5; // 任务统计
  CorrectionSummaryItem lastPeriodCorrectionSummaryItem = 6; // 上一周期作业批改统计
  HomeworkAssistantReportUserRankInfo homeworkAssistantReportUserRankInfo = 7; // 用户排行榜信息
}

message RegisterSearchDevicesRequest {
  repeated string SNId = 1 [(validate.rules).repeated = {min_items: 1}];
}

message RegisterSearchDevicesReply {
  bool status = 1; // 是否成功：true:成功，false:失败
}

message QuerySearchRecordListRequest {
  string SNId = 1 [(validate.rules).string = {min_len: 1}];
  string userId = 2 [(validate.rules).string = {min_len: 1}];
  string subject = 3 [(validate.rules).string = {min_len: 1}];
  int32 questionSourceType = 4; // 问题来源：0:全部；1:作业错题；2:答疑记录;
  int32 rectificationType = 5; // 订正状态：0:全部；1:已改错；2:未改错；
  int32 page = 6;
  int32 pageSize = 7;
}

message SearchRecordItem {
  string id = 1; // 记录Id
  string createdAt = 2; // 创建时间
  int32 code = 3; // 状态码
  QuestionData data = 4; // 处理结果
  string msg = 5; // 错误信息
  string requestId = 6; // 平台返回的唯一标识
  string questionId = 7; // 批改记录中的题目id（来源于批改错题时才有值）
  string correctionId = 8; // 批改记录id（来源于批改错题时才有值）
  string imageUrl = 9; // 原图url
  int32 questionSourceType = 10; // 问题来源：1:作业错题；2:答疑记录;
  int32 rectificationType = 11; // 订正状态：1:已改错；2:未改错；
  string rectificationId = 12; // 订正记录id
}

message SearchRecordList {
  string subject = 1; // 学科
  int32 total = 2; // 数量
  repeated SearchRecordItem recordList = 3; // 记录列表
}

message QuerySearchRecordListReply {
  repeated SearchRecordList searchRecordList = 1; // 搜题记录列表
}

message QuestionDetail {
  string id = 1; // 问题的标识
  string question = 2; // 题目html标签
  string hint = 3; // 解析html标签
  string answer = 4; // 答案html标签
  repeated string css = 5; // 答案css数组
  repeated string js = 6; // 答案js数组
  float rank_score = 7; // 相似度得分
  string subject = 8; // 学科
  string point = 9; // 知识点id
  string point_name = 10; // 知识点名称
  string grade = 11; // 年级
}

message QuestionData {
  int32 total = 1; // 总数
  repeated QuestionDetail questionArr = 2; // 结果数组
  string traceId = 3; // 本次请求唯一Id标识
  string imageUrl = 4; // 原图url
}

message QuerySearchResultByIdRequest {
  string id = 1 [(validate.rules).string = {min_len: 1}];
}

message QuerySearchResultByIdReply {
  string id = 1;
  int32 code = 2; // 状态码
  QuestionData data = 3; // 处理结果
  string msg = 4; // 错误信息
  string requestId = 5; // 平台返回的唯一标识
  string questionId = 6; // 批改记录中的题目id
  string correctionId = 7; // 批改记录id
  string rectificationId = 8; // 订正记录id
  int32 questionSourceType = 9; // 问题来源：1:作业错题；2:答疑记录;
}

message SearchQuestionRequest {
  string image = 1 [(validate.rules).string = {min_len: 1}];
}

message BatchSearchQuestionRequest {
  repeated QuestionImage images = 1 [(validate.rules).repeated = {min_items: 1}]; // 图片列表
  string subject = 2 [(validate.rules).string = {min_len: 1}]; // 学科 数学 语文 英语 ...
  string taskId = 3 [(validate.rules).string = {min_len: 1}]; // 任务id
}

message QuestionImage {
  string image = 1 [(validate.rules).string = {min_len: 1}]; // 图片base64
  string questionId = 2; // 批改记录中的题目id
  string correctionId = 3; // 批改记录id
}

message BatchSearchQuestionReply {}

message SearchQuestionReply {
  string id = 1; // 搜题的唯一标识ID;通用返回错误原因：SEARCH_QUESTION_FAILED：搜题出错（接口调用失败等）；EMPTY_SEARCH_RESULT ： 搜索不到题目；JSON_UNMARSHAL_FAILED：数据解析失败；TOO_MANY_REQUEST：请求过多，入队列失败；SEARCH_QUESTION_TIMEOUT：搜题超时
}

message FullPageCorrectionRequest {
  repeated string imageUrls = 1 [(validate.rules).repeated = {min_items: 1}]; // 题目图片url列表
}

message FullPageCorrectionReply {
  string id = 1; // 批改的唯一标识ID
  int32 code = 2; // 好未来接口返回的状态码 20000 无错误 参考：https://openai.100tal.com/documents/article/page?fromWhichSys=admin&id=445
  string msg = 3; // 好未来接口返回的错误信息
}

message FullPageCorrectionDetailRequest {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // 批改的唯一标识ID
}

message FullPageCorrectionDetailReply {
  string id = 1; // 批改的唯一标识ID
  int32 code = 2; // 状态码
  string msg = 3; // 错误信息
  CorrectionData data = 4; // 批改数据
  string subject = 5; // 学科名称
}

message CorrectionData {
  repeated CorrectionImageResult image_results = 1; // 图片批改结果
  CorrectionStatResult stat_result = 2; // 批改中数据统计
  string trace_id = 3; // 学习机trace_Id
}

message CorrectionImageResult {
  string image_id = 1; // 图片id
  string processed_image_url = 2; // 矫正后的图片url
  string paper_subject = 3; // math 数学 chinese 语文 english 英语
  int32 subject = 4; // 0：数学 1：语文 2：英语
  repeated CorrectionQuestionResult results = 5; // 题目批改结果
  CorrectionStatResult stat_result = 6; // 批改中某个图片数据统计
}

message CorrectionQuestionResult {
  string analysis = 1; // 解析
  string analysis_sds = 2; // 三段式解析
  string answer = 3; // 答案
  repeated int32 bbox = 4; // 题目的框坐标
  string bbox_id = 5; // 题目框唯一id
  int32 correct_result = 6; // 整个题目批改结果，0：未批改；1：正确；2：错误；3：未作答
  int32 correct_source = 7; // 批改来源 1整页2口算3单题
  int32 index = 8; // 题目顺序id
  int32 is_finish = 9; // 是否完成批改0：未完成 1：已完成
  int32 isAnalysisFinish = 10; // 解析是否加载完成（只用于语文和英语学科批改） 0：未完成 1：已完成
  string question = 11; // 题干
  string database_id = 12; // 题库id
  string text = 13; // 题目ocr文本
  int32 type = 14; // 题目类型 0：默认 1：口算题 2：选择题 3：判断题 4：填空题 5：应用题 6：连线题 7：画画题 8：题干 9：其他 10：材料 11：圈选题 17：计算题 18：证明题 19：解答题 401：描述提 402：排序题 801：图表题 902：带过程填空
  repeated CorrectionQuestionAnswer answers = 15; // 作答框多道题批改结果
  string uuid = 16; // 题目唯一id
}

message CorrectionQuestionAnswer {
  string answer = 1; // 作答框答案
  repeated int32 bbox = 2; // 用户作答框坐标
  string bbox_id = 3; // 作答框唯一id
  int32 correct_result = 4; // 批改结果 0：未批改 1：对 2：错 3：未作答
  string correct_txt = 5; // 解题思路
  int32 index = 6; // 用户作答题目id
  string text = 7; // 作答框ocr文本
}

message CorrectionStatResult {
  int32 corrected = 1; // 已批改数
  int32 correcting = 2; // 批改中
  int32 all = 3; // 所有记录数
}

message CorrectionResultRequest {
  string correctionId = 1 [(validate.rules).string = {min_len: 16}]; // 整页批改唯一id
  string questionId = 2 [(validate.rules).string = {min_len: 16}]; // 题目唯一id
  int32 correctResult = 3 [(validate.rules).int32 = {
    in: [
      0,
      1,
      2,
      3
    ]
  }]; // 整个题目批改结果，0：未批改；1：正确；2：错误；3：未作答
}

message CorrectionResultReply {}

message QueryCorrectionRecordListRequest {
  string SNId = 1 [(validate.rules).string = {min_len: 1}];
  string userId = 2 [(validate.rules).string = {min_len: 1}];
  string subject = 3 [(validate.rules).string = {min_len: 1}];
  int32 page = 4;
  int32 pageSize = 5;
}

message CorrectionRecordItem {
  string id = 1; // 批改的唯一标识ID
  repeated string images = 2; // 批改数据
  string createdAt = 3; // 创建时间
}

message CorrectionRecordList {
  string subject = 1; // 学科
  int32 total = 2; // 数量
  repeated CorrectionRecordItem recordList = 3; // 记录列表
}

message QueryCorrectionRecordListReply {
  repeated CorrectionRecordList correctionRecordList = 1; // 批改记录列表
}

message TopicSearchRequest {
  string topicName = 1 [(validate.rules).string = {min_len: 1}]; // 知识点名称
}

message TopicSearchReply {
  int32 total = 1; // 总数
  int32 code = 2; // 0 -正常值 -1-敏感词
  bool hasFilterWords = 3; // 用户输入是否包含过滤词
  repeated TopicSearchItem items = 4; // 知识点列表
}

message TopicSearchItem {
  string topicId = 1; // 知识点id
  string topicName = 2; // 知识点名称
  string videoId = 3; // 视频id.
  string specialCourseId = 4; // 课程包id
  string cover = 5; // 视频封面
  Detail detail = 6; // 知识点详情
}

message Detail {
  repeated int32 stageId = 1; // 学段ids
  repeated int32 subjectId = 2; // 学科ids
  int32 publisherId = 3; // 出版社id
  int32 semesterId = 4; // 册id
  string packageId = 5; // 课程包id
  string chapterId = 6; // 章节id
  string sectionId = 7; // 大节id
}

message QueryHomeworkTaskWrongQuestionCountRequest {
  string taskId = 1 [(validate.rules).string = {min_len: 1}]; // 任务id
}

message QueryHomeworkTaskWrongQuestionCountReply {
  int32 count = 1; // 错题数量
}

message RectificationRequest {
  string id = 1; // 订正记录id（重新订正时必选）
  string wrongQuestionRecordId = 2 [(validate.rules).string = {min_len: 1}]; // 错题记录id
  repeated string imageUrls = 3 [(validate.rules).repeated = {min_items: 1}]; // 订正答案图片url列表
  int32 rectificationResult = 4 [(validate.rules).int32 = {
    in: [
      1,
      2,
      3
    ]
  }]; // 订正结果：0-未订正 1-订正正确 2-订正错误 3-订正半对半错
}

message RectificationReply {
  string id = 1; // 订正记录id
}

message RectificationInfoRequest {
  string id = 1 [(validate.rules).string = {min_len: 1}]; // 订正记录id
}

message RectificationInfoReply {
  string id = 1; // 订正记录id
  repeated string imageUrls = 2; // 订正答案图片url列表
  int32 rectificationResult = 3; // 订正结果：0-未订正 1-订正正确 2-订正错误 3-订正半对半错
}
