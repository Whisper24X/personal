yc:
  redis:
    devices-learn:
      name: devices-learn
      addr: 10.8.8.117:6379
      username:
      password:
      db: 7
      readTimeout: 3 #读超时时间，默认3秒，-1表示取消读超时
      writeTimeout:
      keyPrefix:
      maxLatency:  #执行时间，超出后会执行 LatencyHookFn 函数
      poolFIFO: True # 连接池的类型。FIFO 池为 true，LIFO 池为 false; 请注意，与 lifo 相比，fifo 的开销更高
      poolSize: 10 # 最大套接字连接数。
      poolTimeout: 5 # 如果所有连接都忙，则客户端在返回错误之前等待连接的时间。
      minIdleConns: 0 # 建立新连接缓慢时有用的最小空闲连接数。
      idleTimeout:  # 客户端关闭空闲连接的时间。应该小于服务器的超时时间。
      maxConnAge:  # 客户端退出（关闭）连接的连接年龄。默认是不关闭老化的连接。
  pg:
    devices-learn:
      name: devices-learn
      host: 10.8.8.110
      port: 5433
      user: postgres
      password: 7to12pg12
      db: devices_learn
      sslMode: disable
      maxIdleConns: 5
      maxOpenConns: 10
      connMaxLifetime: 60s
      debug: true
      singularTable: true
      disableMetric: false
      slowThreshold: 0.5s
  nacos:
    host: ${NACOS_SD_HOST}
    port: ${NACOS_SD_PORT}
    username: ${NACOS_SD_ACCOUNT}
    password: ${NACOS_SD_PASSWD}
  kafka:
    user:
      name: user
      address:
        - 10.8.8.207:9092
      securityProtocol: plaintext                  # 通讯协议；默认是plaintext，文本模式，如果需要走证书需要调整加密协议
      tls: false                                     # 是否加密
      topic: update_user                             # topic
      sasl: # 用户名密码配置
        enable: false
        user: username
        password: password
        mechanism: PLAIN
      producer:
        batch: true               # 是否批量发送消息
        batchMaxMs: 5             # 批量发送消息:生产者批发送的时间间隔,先攒5ms,5ms有一批数据就发一批,有几个发几个 默认:5ms; 参数:queue.buffering.max.ms
        batchMaxMessages: 100000  # 批量发送消息:本地队列上允许储存的最大消息数。 此队列由所有主题和分区共享, 用于异步发送数据,默认:100000。参数:queue.buffering.max.messages
        batchMaxKbytes: 1048576   # 批量发送消息:本地队列上允许的最大消息的字节大小数。 此队列由所有主题和分区共享。 此属性的优先级高于 queueBufferingMaxMessages, 大小达到上线,则会停止 默认: 1048576 = 1M。参数:queue.buffering.max.kbytes
      consumer:
        mode: single                             # 消费模式：single 单条消费(不填，默认为该模式)； multiSingle 批量单条消费（批量消费会根据key进行hash启动batchAmount个协程去消费）；multiBatch （一次获取batchAmount个消息，同时处理，然后提交）
        group: CID_xxxxxxxxxxxxxxxxxx            # 消费者 所在组
        batchAmount: 1                           # 批量消费数量: 默认1单条消费
        timeoutMs: 10000                         # 消费超时时间,一次拉取的消费超时时间,超过该时间,则自动提交
        maxPollMs: 300000                        # 消费者最大轮询时间,超出时间后,会执行reBalance;默认:300000ms 5分钟；为了避免在低峰期经常出现rebalance，建议设置较大一点值；对应kafka参数: max.poll.interval.ms
        autoOffsetReset: latest                # 消费者偏移量重置策略:默认:latest(新的分组offset从最最新的数据开始消费),earliest：从最早开始消费;参数:auto.offset.reset
        maxWaitMs: 1000                          # 非必填；该参数为：multiBatch模式，批量多条消费时,如果在没有达到最大收集数量：batchAmount时，最多的等待时长: 默认:1000ms;
    userRegion:
      name: userRegion
      address:
        - 10.8.8.207:9092
      securityProtocol: plaintext                  # 通讯协议；默认是plaintext，文本模式，如果需要走证书需要调整加密协议
      tls: false                                     # 是否加密
      topic: user-region-update                      # kafka：topic
      sasl: # 用户名密码配置
        enable: false
        user: username
        password: password
        mechanism: PLAIN
      producer:
        batch: true               # 是否批量发送消息
        batchMaxMs: 5             # 批量发送消息:生产者批发送的时间间隔,先攒5ms,5ms有一批数据就发一批,有几个发几个 默认:5ms; 参数:queue.buffering.max.ms
        batchMaxMessages: 100000  # 批量发送消息:本地队列上允许储存的最大消息数。 此队列由所有主题和分区共享, 用于异步发送数据,默认:100000。参数:queue.buffering.max.messages
        batchMaxKbytes: 1048576   # 批量发送消息:本地队列上允许的最大消息的字节大小数。 此队列由所有主题和分区共享。 此属性的优先级高于 queueBufferingMaxMessages, 大小达到上线,则会停止 默认: 1048576 = 1M。参数:queue.buffering.max.kbytes
      consumer:
        mode: single                             # 消费模式：single 单条消费(不填，默认为该模式)； multiSingle 批量单条消费（批量消费会根据key进行hash启动batchAmount个协程去消费）；multiBatch （一次获取batchAmount个消息，同时处理，然后提交）
        group: CID_xxxxxxxxxxxxxxxxxx            # 消费者 所在组
        batchAmount: 1                           # 批量消费数量: 默认1单条消费
        timeoutMs: 10000                         # 消费超时时间,一次拉取的消费超时时间,超过该时间,则自动提交
        maxPollMs: 300000                        # 消费者最大轮询时间,超出时间后,会执行reBalance;默认:300000ms 5分钟；为了避免在低峰期经常出现rebalance，建议设置较大一点值；对应kafka参数: max.poll.interval.ms
        autoOffsetReset: latest                # 消费者偏移量重置策略:默认:latest(新的分组offset从最最新的数据开始消费),earliest：从最早开始消费;参数:auto.offset.reset
        maxWaitMs: 1000                          # 非必填；该参数为：multiBatch模式，批量多条消费时,如果在没有达到最大收集数量：batchAmount时，最多的等待时长: 默认:1000ms;
  rabbitmq:
    devices-learn: # 默认rabbitmq
      vhost: devices
      userName: admin
      password: onion345
      endPoint: 10.8.8.14
      reconnectLimit: 5
      reconnectTimeGap: 10
      business:
        nowPublish: #立即投递
          enable: true #是否开启
          exchangeName: exchange_devices_learn
          queueName: devices_learn_now_publish
          bindingKey: exchange_devices_learn_bind_now_publish
        delayPublish: #延迟投递
          enable: true #是否开启
          exchangeName: exchange_devices_learn
          queueName: devices_learn_delay_publish
          bindingKey: exchange_devices_learn_bind_delay_publish
        deviceHeartbeat: #立即投递
          enable: true #是否开启
          exchangeName: exchange_devices_learn
          queueName: devices_learn_heartbeat
          bindingKey: exchange_devices_learn_bind_device_heartbeat
  cronTasks:
    tasks:
      task1:
        name: task1
        cron: "0 0 0 * * *"
        mode: default
        notify:
          type: NONE
          feiShu:
            url: ""
            title: 定时任务
      task2:
        name: task1
        cron: "0 0 0 * * *"
        mode: default
        notify:
          type: NONE
          feiShu:
            url: ""
            title: 定时任务
ratelimit:
  window: 10
  bucket: 100
  cpuThreshold: 800